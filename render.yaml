services:
  - type: web
    name: vendor-saas-licensing
    runtime: node
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: APP_SECRET
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: NODE_ENV
        value: production
